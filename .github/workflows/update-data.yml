name: Update meta data

on:
  schedule:
    - cron: "0 6 3 * *"   # 3rd of each month; Smogon usually publishes in the first few days
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Fetch new months
        run: |
          meta-tracker -v update
          meta-tracker --format gen9uu --cutoff 1630 -v update
      - name: Regenerate report and charts
        run: |
          meta-tracker report
          meta-tracker charts
          meta-tracker export
          meta-tracker --format gen9uu --cutoff 1630 report
          meta-tracker --format gen9uu --cutoff 1630 charts
          meta-tracker --format gen9uu --cutoff 1630 export
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meta.db reports exports
          git diff --cached --quiet || git commit -m "Update meta data $(date +%Y-%m)"
          git push
